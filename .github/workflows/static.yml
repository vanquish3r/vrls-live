# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write    # Grants the bot permission to save the txt files to your repo
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate all manifests
        run: |
          # Generate poster manifest
          cd poster-slideshow || true
          ls -1 *.[jJ][pP][gG] *.[jJ][pP][eE][gG] *.[pP][nN][gG] *.[wW][eE][bB][pP] 2>/dev/null > posters.txt || true
          cd ..
          
          # Generate music manifest (case-insensitive for .mp3 or .MP3)
          cd music || true
          ls -1 *.[mM][pP]3 2>/dev/null > music.txt || true
          cd ..
          
          # Generate sfx manifest (case-insensitive)
          cd sfx || true
          ls -1 *.[mM][pP]3 2>/dev/null > sfx.txt || true
          cd ..

      - name: Save manifests back to GitHub Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add poster-slideshow/posters.txt music/music.txt sfx/sfx.txt || true
          git commit -m "Auto-generate media manifests" || true
          git push || true

      - name: Prepare deployment folder
        run: |
          mkdir dist
          cp -r poster-slideshow dist/ || true
          cp -r music dist/ || true
          cp -r sfx dist/ || true
          cp -r live dist/ || true
          cp -r posters dist/ || true
          cp index.html dist/ 2>/dev/null || true
          # Uncomment below if you have css or js folders
          # cp -r css dist/ || true
          # cp -r js dist/ || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4