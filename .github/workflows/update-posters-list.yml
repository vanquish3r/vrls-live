name: Update Posters Manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'poster-slideshow/**'
      - '!poster-slideshow/posters.txt'

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate posters.txt
        run: |
          cd poster-slideshow
          ls -1 *.jpg *.jpeg *.png *.webp 2>/dev/null > posters.txt || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add poster-slideshow/posters.txt
          git diff --staged --quiet || git commit -m "Auto-update posters.txt manifest"
          git push